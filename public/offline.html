<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanctuary - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-container {
      max-width: 360px;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #1e3a8a;
    }
    p {
      font-size: 16px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="offline-container">
    <img src="/icon-192x192.png" alt="Sanctuary" class="offline-icon" />
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
