services:
  db:
    image: postgres:16-alpine
    container_name: sanctuary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanctuary
      POSTGRES_USER: sanctuary_user
      POSTGRES_PASSWORD: sanctuary_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
